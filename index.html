<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>今天你喊號｜橘時咖啡</title>

<style>
body{
margin:0;
background:#fff7ef;
font-family:sans-serif;
display:flex;
justify-content:center;
padding:30px;
color:#3d220f;
}

.container{
max-width:480px;
width:100%;
text-align:center;
}

.logo{
font-size:32px;
font-weight:900;
margin-bottom:10px;
color:#ff6b00;
}

.title{
font-size:42px;
font-weight:900;
line-height:1.2;
margin-bottom:15px;
}

.sub{
font-size:20px;
margin-bottom:25px;
color:#7b4b25;
}

.card{
background:white;
border-radius:30px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.number{
font-size:110px;
font-weight:900;
color:#ff6b00;
margin:20px 0;
}

button{
border:none;
background:#ff6b00;
color:white;
font-size:24px;
padding:18px 40px;
border-radius:100px;
font-weight:900;
cursor:pointer;
box-shadow:0 6px 0 #cc5500;
}

button:active{
transform:translateY(3px);
box-shadow:0 3px 0 #cc5500;
}

.desc{
margin-top:25px;
font-size:18px;
line-height:1.7;
}

.footer{
margin-top:30px;
font-size:14px;
color:#999;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
橘時咖啡
</div>

<div class="title">
今天你喊號
</div>

<div class="sub">
晚上轉盤。<br>
轉到你，這單我們請。
</div>

<div class="card">

<div id="number" class="number">
?
</div>

<button onclick="drawNumber()">
開始抽號
</button>

<div class="desc">
留言你的幸運數字。<br>
晚上我們真的會轉。
</div>

</div>

<div class="footer">
Orange Time Coffee
</div>

</div>

<script>

function drawNumber(){

const num = Math.floor(Math.random()*100)+1;

document.getElementById("number").innerText = num;

}

</script>

</body>
</html>
